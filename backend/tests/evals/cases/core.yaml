- id: partial_stale
  description: >
    A partial document (HDFC-only) that is ALSO stale (older as_of than
    the current HDFC position) must touch nothing at all — not partially
    apply the partial-scope rule while ignoring staleness, or vice versa.
  layer: L1
  tags: [staleness, completeness, partial]
  current_nw:
    as_of: "2026-07-31"
    reporting_currency: INR
    positions:
      "Assets:Bank:HDFC:6789":
        account_name: "Assets:Bank:HDFC:6789"
        value: "150000.00"
        currency: INR
        as_of: "2026-07-31"
      "Assets:Bank:ICICI:4321":
        account_name: "Assets:Bank:ICICI:4321"
        value: "78000.00"
        currency: INR
        as_of: "2026-06-15"
    total: "228000.00"
  files: [fixtures/hdfc_2026_05.pdf]
  expected_nw: !include expected/partial_stale.json
  permute: false

- id: same_content_different_file
