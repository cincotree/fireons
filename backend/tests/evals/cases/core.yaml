    not a literal re-submission of the same file) must still be
    idempotent — dedup has to work at the fact level, not the file-hash
    level.
  layer: L1
  tags: [idempotency]
  current_nw: {as_of: null, reporting_currency: INR, positions: {}, total: "0"}
