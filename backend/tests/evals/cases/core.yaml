- id: retirement_funds_fresh
  description: >
    EPF, PPF, and NPS are three genuinely different document formats
    from three different institutions, ingested together. Unlike
    unvested RSU, retirement balances count toward net worth despite
    being illiquid — this money is earned and owned, just locked up,
    not conditional/unearned the way unvested equity is. Two real-
    document corrections baked in here: EPF's Pension (EPS) balance is
    tracked as its own position, separate from the withdrawable PF
    corpus, since a real EPFO passbook shows three balance columns
    (Employee/Employer/Pension) with no summed total at all — EPS is a
    formula-based annuity entitlement, not a bankable lump sum, so it's
    kept visible but distinct rather than silently merged in. And PPF
    is not a separate document schema — a real HDFC-issued PPF account
    uses the exact same statement template as a regular savings
    account, distinguished only by a Product field, so the fixture
    reuses the HDFC layout rather than inventing a standalone passbook.
  layer: L1
  tags: [baseline, retirement, epf, eps, ppf, nps]
  current_nw: {as_of: null, reporting_currency: INR, positions: {}, total: "0"}
  files: [fixtures/epfo_2026_07.pdf, fixtures/ppf_2026_07.pdf, fixtures/nps_2026_07.pdf]
  expected_nw: !include expected/retirement_funds_fresh.json
  permute: true

- id: cas_positions_independent_nav_dates
  description: >
    as_of belongs to the position, not the document. A real CAMS CAS
    states each holding's own "NAV on <date>" independent of the
    statement's overall period, and a real KFinTech CAS literally has a
    per-row NAV Date column — two holdings in one document commonly
    carry different dates, because the underlying schemes' latest
    available NAVs simply land on different days. Every other CAS-based
    case in this file happens to use uniform dates across positions,
    which never exercised this. Here one CAS has two folios on two
    different NAV dates; each resulting position must carry its own
    as_of, not the document's period-end date forced onto both.
  layer: L1
