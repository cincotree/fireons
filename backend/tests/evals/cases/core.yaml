- id: redemption
  description: >
    An exhaustive CAS listing only 2 of 3 previously-known folios means
    the 3rd was genuinely redeemed and must be removed, not left stale.
  layer: L1
  tags: [completeness, redemption, cams]
  current_nw:
    as_of: "2026-06-30"
    reporting_currency: INR
    positions:
      "Assets:Investment:MutualFund:SampleAMC1:FOLIO001:SchemeAlpha":
        account_name: "Assets:Investment:MutualFund:SampleAMC1:FOLIO001:SchemeAlpha"
        units: "95.000"
        nav: "48.0000"
        value: "4560.00"
        currency: INR
        as_of: "2026-06-30"
      "Assets:Investment:MutualFund:SampleAMC2:FOLIO002:SchemeBeta":
        account_name: "Assets:Investment:MutualFund:SampleAMC2:FOLIO002:SchemeBeta"
        units: "200.000"
        nav: "24.0000"
        value: "4800.00"
        currency: INR
        as_of: "2026-06-30"
      "Assets:Investment:MutualFund:SampleAMC1:FOLIO003:SchemeGamma":
        account_name: "Assets:Investment:MutualFund:SampleAMC1:FOLIO003:SchemeGamma"
        units: "50.000"
        nav: "40.0000"
        value: "2000.00"
        currency: INR
        as_of: "2026-06-30"
    total: "11360.00"
  files: [fixtures/cams_2026_07.pdf]
  expected_nw: !include expected/redemption.json
  permute: false

- id: partial_omission
  description: >
    An HDFC-only statement is inherently partial — it says nothing about
    ICICI. The ICICI position must survive untouched, not be zeroed just
    because it's absent from this document.
  layer: L1
  tags: [completeness, partial]
  current_nw:
    as_of: "2026-06-30"
    reporting_currency: INR
    positions:
      "Assets:Bank:HDFC:6789":
        account_name: "Assets:Bank:HDFC:6789"
        value: "145000.00"
        currency: INR
        as_of: "2026-06-30"
      "Assets:Bank:ICICI:4321":
        account_name: "Assets:Bank:ICICI:4321"
        value: "78000.00"
        currency: INR
        as_of: "2026-06-15"
    total: "223000.00"
  files: [fixtures/hdfc_2026_07.pdf]
  expected_nw: !include expected/partial_omission.json
  permute: false

