- id: stale_exhaustive_does_not_zero
  description: >
    An exhaustive CAS that is also STALE (older as_of than current data)
    must not zero out positions it doesn't mention. Completeness-driven
    zeroing must respect the staleness/supersession rule, not override it —
    this is the exact interaction the three-timestamp design exists to
    protect against.
  layer: L1
  tags: [staleness, completeness, supersession]
  current_nw:
    as_of: "2026-07-31"
    reporting_currency: INR
    positions:
      "Assets:Investment:MutualFund:SampleAMC1:FOLIO001:SchemeAlpha":
        account_name: "Assets:Investment:MutualFund:SampleAMC1:FOLIO001:SchemeAlpha"
        units: "100.000"
        nav: "50.0000"
        value: "5000.00"
        currency: INR
        as_of: "2026-07-31"
      "Assets:Investment:MutualFund:SampleAMC2:FOLIO002:SchemeBeta":
        account_name: "Assets:Investment:MutualFund:SampleAMC2:FOLIO002:SchemeBeta"
        units: "200.000"
        nav: "25.0000"
        value: "5000.00"
        currency: INR
        as_of: "2026-07-31"
      "Assets:Investment:MutualFund:SampleAMC1:FOLIO003:SchemeGamma":
        account_name: "Assets:Investment:MutualFund:SampleAMC1:FOLIO003:SchemeGamma"
        units: "50.000"
        nav: "40.0000"
        value: "2000.00"
        currency: INR
        as_of: "2026-07-31"
    total: "12000.00"
  files: [fixtures/cams_2026_05.pdf]
  expected_nw: !include expected/stale_exhaustive_does_not_zero.json
  permute: false

