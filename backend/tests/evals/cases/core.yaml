- id: stale_after_fresh
  description: >
    A May CAS ingested alongside a July CAS must not roll positions back,
    regardless of which order they arrive in. This is the core staleness
    guarantee (as_of supersession).
  layer: L1
  tags: [staleness, cams, supersession]
  current_nw: {as_of: null, reporting_currency: INR, positions: {}, total: "0"}
  files: [fixtures/cams_2026_07.pdf, fixtures/cams_2026_05.pdf]
  expected_nw: !include expected/cams_2026_07_only.json
  permute: true

- id: restatement
  description: >
    Same as_of, corrected figures, later doc_issued_at — the correction
    must win regardless of arrival order (the (as_of, doc_issued_at)
    tie-break, not ingestion order, decides).
  layer: L1
  tags: [restatement, supersession]
  current_nw: {as_of: null, reporting_currency: INR, positions: {}, total: "0"}
