- id: insurance_classification
  description: >
    ULIP/endowment policies carry a real surrender value and must be
    counted; term insurance has no cash value and must contribute
    nothing — even though its statement prominently displays a large
    "Sum Assured" figure that a naive parser could mistake for owned
    money. Only the ULIP's surrender value (not its larger fund value,
    which isn't what you'd actually get) should appear. Correctly
    excluding the term policy is expected, successful behavior, not an
    error — no warning should be raised.
  layer: L1
  tags: [insurance, classification, ulip, term]
  current_nw: {as_of: null, reporting_currency: INR, positions: {}, total: "0"}
  files: [fixtures/ulip_2026_07.pdf, fixtures/term_insurance_2026_07.pdf]
