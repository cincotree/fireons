[project]
name = "fireons"
version = "0.1.0"
description = ""
authors = [
    {name = "Abhinaya Sukumar", email = "abhinaya@users.noreply.github.com"}
]
requires-python = ">=3.10.5"
dependencies = [
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "alembic>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
]

[dependency-groups]
dev = []

[tool.pyright]
typeCheckingMode = "off"
reportInvalidTypeForm = "none"
reportTypeVariableUsage = "none"
diagnosticRuleSet = { reportTypeVariableUsage = "none", reportGeneralTypeIssues = "none" }
