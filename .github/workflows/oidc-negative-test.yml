name: OIDC negative test (temporary)

on:
  push:
    branches: [ao/implement-shortcut-story/infra-foundation]
    paths: [.github/workflows/oidc-negative-test.yml]

permissions:
  contents: read

jobs:
  get-role:
    name: Read role from the production environment
    runs-on: ubuntu-latest
    environment: production
    outputs:
      role: ${{ steps.read.outputs.role }}
    steps:
      - id: read
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: echo "role=$ROLE" >> "$GITHUB_OUTPUT"

  assume-inside-environment:
    name: Assume role inside the production environment (must succeed)
    needs: get-role
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.get-role.outputs.role }}
          aws-region: ap-southeast-1
      - run: aws sts get-caller-identity --query Arn --output text > /dev/null

  assume-outside-environment:
    name: Assume role without the environment (must be rejected)
    needs: get-role
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: assume
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.get-role.outputs.role }}
          aws-region: ap-southeast-1
      - name: Require the assume to have failed
        env:
          OUTCOME: ${{ steps.assume.outcome }}
        run: |
          echo "assume outcome: $OUTCOME"
          test "$OUTCOME" = "failure"
